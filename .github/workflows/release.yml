name: Release

# Pushing a tag publishes a GitHub release for one browser:
#   firefox-v1.2.0   releases the Firefox extension
#   chrome-v1.2.0    releases the Chrome extension
# The number in the tag must match "version" in that browser's manifest.json.
#
# Firefox is also signed as a private (unlisted) add-on when the repository has the
# secrets AMO_JWT_ISSUER and AMO_JWT_SECRET. Without them the release still contains
# the zip, just not the signed .xpi.
#
# It can also be started by hand for a tag that already exists, to build, sign and
# attach the files to that tag's release (the release is updated, not recreated):
#   gh workflow run release.yml -f tag=firefox-v1.2.0

on:
  push:
    tags:
      - "firefox-v*"
      - "chrome-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach files for, e.g. firefox-v1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read the browser and version from the tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^(firefox|chrome)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag. Expected firefox-vX.Y.Z or chrome-vX.Y.Z."
            exit 1
          fi
          echo "browser=${TAG%%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*-v}" >> "$GITHUB_OUTPUT"

      - name: Check the manifest version matches the tag
        env:
          BROWSER: ${{ steps.tag.outputs.browser }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          actual="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$BROWSER/manifest.json")"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::The tag says $VERSION but $BROWSER/manifest.json says $actual. Run scripts/bump-version.sh, commit, and tag again."
            exit 1
          fi

      - name: Run the unit tests
        working-directory: ${{ steps.tag.outputs.browser }}
        run: osascript -l JavaScript test/run.js

      - name: Build the package
        id: build
        env:
          BROWSER: ${{ steps.tag.outputs.browser }}
        run: echo "zip=$(bash scripts/build.sh "$BROWSER")" >> "$GITHUB_OUTPUT"

      - name: Sign the Firefox add-on (private, not published on addons.mozilla.org)
        if: steps.tag.outputs.browser == 'firefox' && env.AMO_JWT_ISSUER != ''
        run: >
          npx --yes web-ext@8 sign
          --source-dir dist/firefox
          --artifacts-dir dist/signed
          --channel unlisted
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ steps.tag.outputs.browser }}
          VERSION: ${{ steps.tag.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          shopt -s nullglob
          files=("$ZIP" dist/signed/*.xpi)
          case "$BROWSER" in
            firefox) name="Firefox" ;;
            chrome) name="Chrome" ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --verify-tag \
              --title "Tab Labels for $name $VERSION" \
              --generate-notes
          fi
